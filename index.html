<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>极简禅意 · 小游戏合集</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#8d6e63">

<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{background:#fff;min-height:100vh;display:flex;justify-content:center;align-items:center;font-family:'STKaiti','KaiTi','楷体','SimSun','宋体',serif;padding:30px 20px}
.wrap{max-width:740px;width:100%}
h1{font-size:32px;color:#111;letter-spacing:14px;text-align:center;margin-bottom:6px;font-weight:400}
.sub{text-align:center;font-size:13px;color:#999;letter-spacing:6px;margin-bottom:40px}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:20px}
.card{border:1px solid #111;padding:24px 20px;cursor:pointer;text-decoration:none;color:#111;transition:all .25s;display:block}
.card:hover{background:#111;color:#fff}
.card:hover .desc{color:#ccc}
.card .name{font-size:22px;letter-spacing:8px;margin-bottom:8px}
.card .desc{font-size:13px;color:#888;letter-spacing:2px;line-height:1.8;transition:color .25s}
.card .tag{display:inline-block;font-size:11px;border:1px solid #ccc;padding:2px 10px;margin-top:10px;letter-spacing:2px}
.card:hover .tag{border-color:#fff;color:#fff}
.footer{text-align:center;margin-top:40px;font-size:11px;color:#ccc;letter-spacing:4px}
</style>
</head>
<body>
<div class="wrap">
<h1>极 简 禅 意</h1>
<div class="sub">小 游 戏 合 集</div>
<div class="games">
<a class="card" href="墨涌/index.html">
<div class="name">墨 涌</div>
<div class="desc">白底黑墨，墨核躲避四面八方涌来的墨滴，金墨可获短暂无敌。</div>
<div class="tag">躲避</div>
</a>
<a class="card" href="字坠/index.html">
<div class="name">字 坠</div>
<div class="desc">汉字从天而降，输入拼音首字母将其击碎。漏掉一字失去一次机会。</div>
<div class="tag">打字</div>
</a>
<a class="card" href="一笔禅/index.html">
<div class="name">一笔禅</div>
<div class="desc">从起点开始，一笔连完所有节点。不重复经过，鼠标拖拽连线。</div>
<div class="tag">连线</div>
</a>
<a class="card" href="弹墨/index.html">
<div class="name">弹 墨</div>
<div class="desc">移动鼠标控制拍板，弹珠击碎砖块。8关递增难度，墨尽则败。</div>
<div class="tag">打砖块</div>
</a>
<a class="card" href="棋影/index.html">
<div class="name">棋 影</div>
<div class="desc">黑白翻转棋，落子翻转对方棋子。人机对战，黑先白后。</div>
<div class="tag">棋类</div>
</a>
<a class="card" href="碎镜/index.html">
<div class="name">碎 镜</div>
<div class="desc">点击两块碎片交换位置，拼回禅意几何图案。6关递增难度。</div>
<div class="tag">拼图</div>
</a>
</div>
<div class="footer">Esc 随时退出 · 纯白极简 · 零外部依赖</div>
</div>

<script>
/* PWA: 注册 Service Worker，注册后本页被缓存，断网也能打开。
   catch 掉异常，浏览器不支持时不影响正常功能。 */
if ('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  });
}
</script>
</body>
</html>
